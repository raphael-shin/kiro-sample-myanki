name: AI Review

# Three advisory reviews by Kiro CLI in headless mode:
#   1. AWS Well-Architected (Opus 5.5) - skipped when the PR has no AWS-related change
#   2. Code review (Opus 5.5)
#   3. Code review (GPT 5.6 Sol)
# Each review is posted as one PR comment and updated in place on every push.
# The reviews do not block merging: a job fails only if the review itself could
# not be produced.
#
# Requires the repository secret KIRO_API_KEY (an API key from app.kiro.dev).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect AWS changes
    # Secrets are not available to fork PRs, so only same-repo PRs are reviewed.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      aws: ${{ steps.detect.outputs.aws }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='@aws-sdk/|aws-sdk|aws-amplify|AWS::|bedrock|boto3|arn:aws:|AWS_(REGION|ACCESS_KEY_ID|SECRET_ACCESS_KEY|PROFILE)'
          # The review setup itself (.github/, .kiro/) mentions AWS terms, so it
          # is left out; otherwise every change to it would trigger this review.
          gh pr diff "$PR" -R "$REPO" --name-only | grep -Ev '^(\.github|\.kiro)/' > files.txt || true
          aws=false
          # 1. Infrastructure files.
          if grep -Eiq '(^|/)(cdk\.json|template\.ya?ml|serverless\.ya?ml|samconfig\.toml)$|\.tf$|(^|/)(infra|cdk|cloudformation|terraform)/' files.txt; then
            aws=true
          fi
          # 2. Changed files that use AWS anywhere in their content, so a change to
          #    timeouts or response handling in an AWS client still counts.
          while IFS= read -r f; do
            content=$(gh api "repos/$REPO/contents/$f?ref=$HEAD_SHA" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
            if printf '%s' "$content" | grep -Eiq "$pattern"; then
              echo "AWS usage in $f"
              aws=true
              break
            fi
          done < files.txt
          # 3. AWS usage in removed lines (a file that dropped its AWS code).
          if [ "$aws" = false ] && [ -s files.txt ]; then
            gh pr diff "$PR" -R "$REPO" > diff.patch
            if grep -E '^-' diff.patch | grep -Ev '^--- ' | grep -Eiq "$pattern"; then
              aws=true
            fi
          fi
          echo "aws=$aws" >> "$GITHUB_OUTPUT"
          echo "AWS-related change: $aws"

  review:
    name: ${{ matrix.title }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `tag` names this review's SHA-scoped output marker: the review must
          # end with `[<tag>-REVIEWED] <head sha>` for its verdict to count.
          - id: aws-well-architected
            title: AWS Well-Architected Review (Opus 5.5)
            tag: AWS
            model: claude-opus-5.5
            prompt: aws-well-architected.md
            agent: aws-reviewer
            needs_aws: true
          - id: opus-code-review
            title: Code Review (Opus 5.5)
            tag: OPUS
            model: claude-opus-5.5
            prompt: code-review.md
            agent: pr-reviewer
            needs_aws: false
          - id: gpt-code-review
            title: Code Review (GPT 5.6 Sol)
            tag: GPT
            model: gpt-5.6-sol
            prompt: code-review.md
            agent: pr-reviewer
            needs_aws: false
    env:
      MARKER: "<!-- ai-review:${{ matrix.id }} -->"
      TITLE: ${{ matrix.title }}
      TAG: ${{ matrix.tag }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SKIP: ${{ matrix.needs_aws && needs.changes.outputs.aws != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare diff
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .review
          gh pr diff "$PR" -R "$REPO" > .review/diff.patch
          gh pr diff "$PR" -R "$REPO" --name-only > .review/files.txt
          # Keep very large diffs within a reviewable size; the model can still
          # read any file from the checkout.
          size=$(wc -c < .review/diff.patch)
          if [ "$size" -gt 400000 ]; then
            head -c 400000 .review/diff.patch > .review/diff.truncated
            mv .review/diff.truncated .review/diff.patch
            printf '\n\n[diff truncated at 400000 bytes; read the changed files directly]\n' >> .review/diff.patch
          fi
          cat .github/review-prompts/common.md ".github/review-prompts/${{ matrix.prompt }}" > .review/prompt.md
          # The output markers are scoped to this commit, so the model needs the
          # SHA and its own review tag verbatim.
          {
            printf '\n## Review context\n\n'
            printf -- '- `<SHA>` (the commit under review): `%s`\n' "$HEAD_SHA"
            printf -- '- `<TAG>` (your review tag): `%s`\n' "$TAG"
            printf -- '- Your last line before `<<<END>>>` must therefore be `[%s-REVIEWED] %s`.\n' "$TAG" "$HEAD_SHA"
          } >> .review/prompt.md

      # The AWS IaC MCP server runs through uvx. Installing it here keeps its
      # start-up inside the MCP connection timeout.
      - name: Install uv and the AWS IaC MCP server
        if: env.SKIP != 'true' && matrix.agent == 'aws-reviewer'
        uses: astral-sh/setup-uv@v6
      - name: Cache the AWS IaC MCP server
        if: env.SKIP != 'true' && matrix.agent == 'aws-reviewer'
        run: uv tool install awslabs.aws-iac-mcp-server@latest

      - name: Install Kiro CLI
        if: env.SKIP != 'true'
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run review
        if: env.SKIP != 'true'
        # Only the Kiro API key is passed in. The GitHub token is not, so the
        # model cannot act on GitHub; the next step posts the comment.
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          MODEL: ${{ matrix.model }}
          AGENT: ${{ matrix.agent }}
        run: |
          kiro-cli --version
          # The agent (.kiro/agents/<name>.json) fixes the tool set: read-only
          # tools, plus the AWS Knowledge MCP server for the AWS review.
          extra=()
          if kiro-cli chat --help 2>&1 | grep -q -- '--trust-workspace'; then
            extra+=(--trust-workspace)
          fi
          # Give remote MCP servers time to connect before the first turn.
          kiro-cli settings mcp.noInteractiveTimeout 30000 || true
          set +e
          kiro-cli chat --no-interactive --model "$MODEL" --agent "$AGENT" "${extra[@]}" \
            "$(cat .review/prompt.md)" > .review/raw.txt 2> .review/stderr.txt
          status=$?
          set -e
          echo "kiro-cli exit status: $status"
          # Strip terminal escape codes and keep only the final review block.
          perl -pe 's/\e\[[0-9;?]*[a-zA-Z]//g; s/\e\].*?(\e\\|\a)//g' .review/raw.txt > .review/clean.txt
          perl -0777 -ne 'my @m = /<<<REVIEW>>>\s*(.*?)\s*<<<END>>>/sg; print $m[-1] if @m' .review/clean.txt > .review/review.md
          if [ ! -s .review/review.md ]; then
            echo "::error::No review block in the output (exit status $status)."
            tail -n 40 .review/stderr.txt || true
            exit 1
          fi

      - name: Build comment
        if: ${{ !cancelled() }}
        id: comment
        run: |
          mkdir -p .review
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # The verdict comes from the review's own SHA-scoped output markers, not
          # from its prose: a marker carrying another commit's SHA does not count.
          reviewed=false
          blocking=false
          findings=false
          if [ -s .review/review.md ]; then
            grep -qF "[$TAG-REVIEWED] $HEAD_SHA" .review/review.md && reviewed=true
            grep -qF "[BLOCK-MERGE] $HEAD_SHA" .review/review.md && blocking=true
            grep -qE '^\*\*(BLOCKING|NON-BLOCKING) — ' .review/review.md && findings=true
          fi
          if [ "$SKIP" = "true" ]; then
            {
              echo "$MARKER"
              echo "## $TITLE — ⏭ skipped"
              echo
              echo "_\`$HEAD_SHA\`에는 AWS 관련 변경이 없어 리뷰를 건너뛰었습니다._"
            } > .review/comment.md
          elif [ "$reviewed" = true ]; then
            if [ "$blocking" = true ]; then
              badge="🔴 changes requested (blocking)"
            elif [ "$findings" = true ]; then
              badge="⚠️ non-blocking findings"
            else
              badge="✅ no blocking findings"
            fi
            {
              echo "$MARKER"
              echo "## $TITLE — $badge"
              echo
              echo "_Reviewed \`$HEAD_SHA\` — this comment is updated in place on each push._"
              echo
              # With nothing to act on, the body is collapsed so the verdict stays
              # the only thing the PR page shows.
              # The extracted block has no trailing newline, so printf adds the
              # line terminator and the blank line that must follow it.
              if [ "$findings" = false ]; then
                echo "<details>"
                echo "<summary>Review details</summary>"
                echo
                printf '%s\n\n' "$(cat .review/review.md)"
                printf '</details>\n\n'
              else
                printf '%s\n\n' "$(cat .review/review.md)"
              fi
              echo "_Verdict parsed from the review's SHA-scoped output markers for commit \`$HEAD_SHA\`._"
            } > .review/comment.md
          else
            {
              echo "$MARKER"
              echo "## $TITLE — ❌ 리뷰 실패"
              echo
              if [ -s .review/review.md ]; then
                echo "_리뷰 본문은 나왔지만 \`[$TAG-REVIEWED] $HEAD_SHA\` 마커가 없어 판정하지 않았습니다. [실행 로그]($run_url)를 확인하세요._"
              else
                echo "_\`$HEAD_SHA\` 리뷰를 만들지 못했습니다. [실행 로그]($run_url)를 확인하세요._"
              fi
            } > .review/comment.md
          fi

      - name: Post or update comment
        if: ${{ !cancelled() && steps.comment.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@.review/comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@.review/comment.md > /dev/null
          fi
