# nginx config for the MyAnki image (nginxinc/nginx-unprivileged).
#
# The container runs as uid 101 with a read-only root filesystem. /tmp is the
# only writable path, so the pid file and every temp path live there.

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Request headers are not logged, so X-Origin-Verify never reaches the logs.
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;
    # Redirects stay relative, so they never point at the container port.
    absolute_redirect off;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "ok\n";
        }

        # Vite writes content-hashed files here. A missing asset is a real 404,
        # not index.html, so a stale HTML page is never cached as a script.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA routing: unknown paths get index.html.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
